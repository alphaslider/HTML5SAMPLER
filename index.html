
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GK_ULTRA // DYNAMIC_SKIN</title>
    <style>
        :root {
            --bg-obsidian: #050505;
            --text-grey: #8b949e; 
            --text-white: #c9d1d9;
            --scale-factor: 1.6; /* Tweak this number to make the machine larger or smaller */
        }
        
        body { 
            font-family: monospace; 
            background: var(--bg-obsidian); 
            color: var(--text-grey); 
            display: flex; align-items: center; justify-content: center;
            height: 100vh; margin: 0; overflow: hidden;
        }

        /* ABSOLUTE POSITIONING CHASSIS */
        .chassis { 
            background-image: url('skin.jpg'); /* Default to clean skin */
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            border: none;
            width: 520px;
            height: 400px;
            position: relative; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            transition: background-image 0.2s ease-in-out; /* Smooth fade between skins */
            
            /* Scales the entire machine up without breaking inner coordinates */
            transform: scale(var(--scale-factor));
            transform-origin: center center;
        }

        /* STATUS LIGHT */
        .status-light {
            position: absolute;
            top: 48px;
            right: 35px;
            width: 10px; height: 10px;
            background: #111;
            border-radius: 50%;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.8);
        }                
        .status-active { 
             background: #fff; 
             box-shadow: 0 0 8px #fff, inset 0 0 2px #fff; 
        }

        /* SCREEN BEZEL */
        .screen-bezel {
            position: absolute;
            top: 93px;
            left: 32px;
            width: 456px;
            height: 65px;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .screen-header {
            display: flex; justify-content: flex-end; 
            font-size: 10px; color: var(--text-grey);
            padding: 0 5px; text-shadow: 0 1px 2px #000;
        }
        #meterCanvas {
            width: 100%; height: 40px;
            background: transparent;
            display: block;
        }

        /* SELECT MENU (Nudged down 7px) */
        select { 
            position: absolute;
            top: 215px;     /* Nudged from 208px */
            left: 32px;
            width: 456px;
            height: 38px;
            appearance: none;
            background: transparent; 
            color: var(--text-white);
            border: none; outline: none;
            font-family: monospace; cursor: pointer; text-transform: uppercase;
            padding-left: 15px; font-size: 11px; text-shadow: 0 1px 2px #000;
        }
        
        .select-wrapper::after {
            content: '▼'; position: absolute;
            top: 227px; right: 45px; /* Nudged from 220px */
            pointer-events: none; font-size: 8px; color: var(--text-grey);
        }

        /* BUTTON ROWS */
        .btn-row-1 { 
            position: absolute;
            top: 271px;
            left: 32px;
            width: 456px;
            display: flex; justify-content: space-between;
        }
        .btn-row-1 button { width: 48%; }

        .btn-row-2 { 
            position: absolute;
            top: 327px;
            left: 32px;
            width: 456px;
            display: flex; justify-content: space-between;
        }
        .btn-row-2 button:first-child { width: 33%; }
        .btn-row-2 button:last-child { width: 63%; }

        /* INVISIBLE HITBOX BUTTONS */
        button {
            background: transparent; 
            border: none; outline: none;
            cursor: pointer;
            height: 38px;
            transition: background 0.1s;
        }
        button:hover:not([disabled]) { 
            background: rgba(255, 255, 255, 0.05); 
        }                
        button:active:not([disabled]) { 
            background: rgba(255, 255, 255, 0.1);
        }
        button[disabled] { cursor: not-allowed; }
        audio { display: none; }  
    </style>
</head>
<body>

<div class="chassis" id="mainChassis">        
    <div id="recLight" class="status-light"></div>    

    <div class="screen-bezel">        
        <div class="screen-header">            
            <span id="gradeDisplay" style="color: var(--text-white);">READY</span>        
        </div>        
        <canvas id="meterCanvas" width="456" height="40"></canvas>    
    </div>

    <div class="select-wrapper">
        <select id="sampleGrade">        
            <option value="hifi" selected>CLEAN (16-BIT / RAW)</option>        
            <option value="lofi1">VINTAGE (12-BIT / 22kHz)</option>        
            <option value="lofi2">CRUSHED (8-BIT / 11kHz)</option>        
            <option value="grit">ULTRA_LOFI (4-BIT / 4kHz)</option>    
        </select>
    </div>

    <div class="btn-row-1">        
        <button id="recordBtn"></button>        
        <button id="stopBtn" disabled></button>    
    </div>

    <div class="btn-row-2">        
        <button id="playBtn" disabled></button>        
        <button id="exportBtn" disabled></button>    
    </div>        
    
    <audio id="preview"></audio>
</div>

<script>    
    let audioCtx, stream, source, processor, analyser;
    let leftChannel = [], rightChannel = [];
    let recording = false;
    let meterAnim;

    const recordBtn = document.getElementById('recordBtn');
    const stopBtn = document.getElementById('stopBtn');
    const playBtn = document.getElementById('playBtn');
    const exportBtn = document.getElementById('exportBtn');
    const gradeSelector = document.getElementById('sampleGrade');
    const preview = document.getElementById('preview');
    const recLight = document.getElementById('recLight');
    const gradeDisplay = document.getElementById('gradeDisplay');        
    const chassis = document.getElementById('mainChassis');
    
    const canvas = document.getElementById('meterCanvas');
    const canvasCtx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const displayWidth = canvas.clientWidth;
    const displayHeight = canvas.clientHeight;
    canvas.width = displayWidth * dpr;
    canvas.height = displayHeight * dpr;
    canvasCtx.scale(dpr, dpr);

    // Dynamic Skin Logic
    gradeSelector.addEventListener('change', (e) => {
        if (e.target.value === 'hifi') {
            chassis.style.backgroundImage = "url('skin.jpg')";
        } else if (e.target.value === 'grit') {
            chassis.style.backgroundImage = "url('crushed.jpg')";
        } else {
            chassis.style.backgroundImage = "url('swampops.jpg')";
        }
    });

    // Master switch for canvas animation states
    function switchCanvasMode(mode) {
        if (meterAnim) cancelAnimationFrame(meterAnim);
        if (mode === 'idle') renderIdleScreen();
        else if (mode === 'sampling') renderInputMeter();
        else if (mode === 'playing') renderPlaybackMeter();
    }

    switchCanvasMode('idle');

    function renderIdleScreen() {
        meterAnim = requestAnimationFrame(renderIdleScreen);
        
        // Base dark background
        canvasCtx.fillStyle = 'rgba(0, 0, 0, 0.4)';
        canvasCtx.fillRect(0, 0, displayWidth, displayHeight);
        
        // Draw normal idle slots
        canvasCtx.fillStyle = '#111';
        const segW = 6;
        const gap = 2;
        for(let i=0; i<displayWidth; i+= (segW + gap)) {
            canvasCtx.fillRect(i, 4, segW, displayHeight - 8);
        }
    }

    recordBtn.onclick = async () => {
        if(audioCtx) audioCtx.close();
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        try {
            stream = await navigator.mediaDevices.getDisplayMedia({ 
                 video: true, 
                 audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } 
             });
                                            
            const audioStream = new MediaStream(stream.getAudioTracks());
            source = audioCtx.createMediaStreamSource(audioStream);
            processor = audioCtx.createScriptProcessor(4096, 2, 2);
                        
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 512; 
            source.connect(analyser);
            analyser.connect(processor);
            processor.connect(audioCtx.destination); 

            leftChannel = []; 
            rightChannel = [];
            recording = true;

            processor.onaudioprocess = (e) => {
                if (!recording) return;
                leftChannel.push(new Float32Array(e.inputBuffer.getChannelData(0)));
                rightChannel.push(new Float32Array(e.inputBuffer.getChannelData(1)));
            };

            switchCanvasMode('sampling');

            recordBtn.disabled = true;
            stopBtn.disabled = false;
            playBtn.disabled = true;
            exportBtn.disabled = true;
            recLight.classList.add('status-active');
            gradeDisplay.innerText = "SAMPLING";
            gradeDisplay.style.color = "#ff3333";
        } catch (err) { alert("Enable audio sharing in the popup."); }
    };

    function renderInputMeter() {
        if (!recording) return;
        meterAnim = requestAnimationFrame(renderInputMeter);                
        
        const dataArray = new Uint8Array(analyser.frequencyBinCount);
        analyser.getByteFrequencyData(dataArray);                
        
        let sum = 0;
        for(let i = 0; i < dataArray.length; i++) sum += dataArray[i];
        let average = sum / dataArray.length;
        
        let meterLevel = (average / 120) * displayWidth; 
        if (meterLevel > displayWidth) meterLevel = displayWidth;

        canvasCtx.fillStyle = 'rgba(0, 0, 0, 0.4)';
        canvasCtx.fillRect(0, 0, displayWidth, displayHeight);

        const segmentWidth = 6;
        const gap = 2;                
        for (let x = 0; x < displayWidth; x += (segmentWidth + gap)) {
            if (x < meterLevel) {
                let ratio = x / displayWidth;
                if (ratio > 0.85) {
                    canvasCtx.fillStyle = '#ff3333'; // Hot
                } else if (ratio > 0.6) {
                    canvasCtx.fillStyle = '#ffcc00'; // Warn
                } else {
                    canvasCtx.fillStyle = '#33cc33'; // Safe
                }
            } else {
                canvasCtx.fillStyle = '#111';
            }
            canvasCtx.fillRect(x, 4, segmentWidth, displayHeight - 8);
        }
    }

    stopBtn.onclick = () => {
        recording = false;
        switchCanvasMode('idle');
                
        if(stream) stream.getTracks().forEach(t => t.stop());
        if(processor) processor.disconnect();
        if(source) source.disconnect();
        
        if(leftChannel.length === 0) {
             resetButtons();
             return;
        }
                        
        const rawL = flattenArray(leftChannel);
        const rawR = flattenArray(rightChannel);
        const processed = applyGrade(rawL, rawR, gradeSelector.value);

        const buffer = audioCtx.createBuffer(2, processed.l.length, processed.rate);
        buffer.copyToChannel(processed.l, 0);
        buffer.copyToChannel(processed.r, 1);
                        
        preview.src = URL.createObjectURL(audioBufferToWav(buffer));
                
        resetButtons();
        gradeDisplay.innerText = "BUFFER_READY";
        gradeDisplay.style.color = "var(--text-grey)";
    };

    function resetButtons() {
        recordBtn.disabled = false;
        stopBtn.disabled = true;
        playBtn.disabled = false;
        exportBtn.disabled = false;
        recLight.classList.remove('status-active');
    }

    playBtn.onclick = () => {
        if (preview.paused) {
            preview.play();
            gradeDisplay.innerText = "PLAYING";
            gradeDisplay.style.color = "var(--text-white)";
            switchCanvasMode('playing');
        } else {
            stopPlayback();
        }
    };

    preview.onended = () => {
        stopPlayback();
    };
    
    function stopPlayback() {
        preview.pause();
        preview.currentTime = 0;
        gradeDisplay.innerText = "BUFFER_READY";
        gradeDisplay.style.color = "var(--text-grey)";
        switchCanvasMode('idle');
    }

    function renderPlaybackMeter() {
        if (preview.paused) return;
        meterAnim = requestAnimationFrame(renderPlaybackMeter);                
        
        const progress = preview.currentTime / preview.duration;
        const playHead = progress * displayWidth;

        canvasCtx.fillStyle = 'rgba(0, 0, 0, 0.4)';
        canvasCtx.fillRect(0, 0, displayWidth, displayHeight);

        const segmentWidth = 6;
        const gap = 2;                
        for (let x = 0; x < displayWidth; x += (segmentWidth + gap)) {
            if (x < playHead) {
                canvasCtx.fillStyle = '#ffffff'; 
            } else {
                canvasCtx.fillStyle = '#111';
            }
            canvasCtx.fillRect(x, 15, segmentWidth, 10);
        }
    }

    function applyGrade(l, r, grade) {
        let step = 1; let bitDepth = 16; let rate = audioCtx.sampleRate;
        if (grade === 'lofi1') { step = 2; bitDepth = 12; }
        else if (grade === 'lofi2') { step = 4; bitDepth = 8; }
        else if (grade === 'grit') { step = 11; bitDepth = 4; }
        const outL = new Float32Array(l.length);
        const outR = new Float32Array(r.length);
        const levels = Math.pow(2, bitDepth);

        for (let i = 0; i < l.length; i += step) {
            let valL = Math.round(l[i] * levels) / levels;
            let valR = Math.round(r[i] * levels) / levels;                                    
            for (let j = 0; j < step && (i + j) < l.length; j++) {
                outL[i + j] = valL;
                outR[i + j] = valR;
            }
        }
        return { l: outL, r: outR, rate: rate };
    }

    function flattenArray(channel) {
        let result = new Float32Array(channel.length * 4096);
        for (let i = 0; i < channel.length; i++) result.set(channel[i], i * 4096);
        return result;
    }

    function audioBufferToWav(buffer) {
        let numOfChan = 2, length = buffer.length * 4 + 44, bufferArr = new ArrayBuffer(length), view = new DataView(bufferArr), pos = 0;
        const setU16 = (d) => { view.setUint16(pos, d, true); pos += 2; };
        const setU32 = (d) => { view.setUint32(pos, d, true); pos += 4; };
        setU32(0x46464952); setU32(length - 8); setU32(0x45564157); setU32(0x20746d66); setU32(16); setU16(1); setU16(2);
        setU32(buffer.sampleRate); setU32(buffer.sampleRate * 4); setU16(4); setU16(16); setU32(0x61746164); setU32(length - pos - 4);
        for (let i = 0; i < buffer.length; i++) {
            for (let ch = 0; ch < 2; ch++) {
                let s = Math.max(-1, Math.min(1, buffer.getChannelData(ch)[i]));
                view.setInt16(pos, s < 0 ? s * 32768 : s * 32767, true); pos += 2;
            }
        }
        return new Blob([view], { type: 'audio/wav' });
    }

    exportBtn.onclick = () => {
        const anchor = document.createElement('a');
        anchor.href = preview.src;
        anchor.download = `GK_ULTRA_${gradeSelector.value.toUpperCase()}.wav`;
        anchor.click();
    };
</script>
</body>
</html>
